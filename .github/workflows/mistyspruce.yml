# https://docs.github.com/cn/actions/automating-builds-and-tests/building-and-testing-python

name: Update dailynews

on:
  schedule:
    - cron: '0 22 * * *'  # 北京时间 06:00
    - cron: '0 10 * * *'  # 北京时间 18:00
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README Date
        run: |
          DATE=$(date -d "yesterday" +"%Y-%m-%d")
          sed -i -E "s|Daily News\([0-9]{4}-[0-9]{2}-[0-9]{2}\)|Daily News(${DATE})|" README.md
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Push articles
        run: python main.py

      - name: Commit
        run: |
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name dawningnow
          git add archive today.md today_false.md README.md
          git commit -m "Daily News(`date +'%Y-%m-%d'`)"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ github.token }}