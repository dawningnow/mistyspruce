# https://docs.github.com/cn/actions/automating-builds-and-tests/building-and-testing-python

name: Update dailynews

on:
  schedule:
    - cron: '0 22 * * *' # 北京时间上午六点
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Push articles
        run: python main.py

      - name: Commit
        run: |
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name dawningnow
          git add archive today.md today_false.md
          git commit -m "Daily News(`date +'%Y-%m-%d'`)\n\n"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ github.token }}

  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    
    steps:
      - name: Keep only latest 7 workflow runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const maxRunsToKeep = 7;
            
            // 获取所有工作流
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            let totalDeleted = 0;
            for (const workflow of workflows.data.workflows) {
              console.log(`处理工作流: ${workflow.name}`);
              
              // 获取该工作流的所有运行记录（按创建时间降序排列）
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                per_page: 100,
                sort: 'created_at',
                direction: 'desc',  // 最新的在前
              });
              
              const allRuns = runs.data.workflow_runs;
              
              // 如果运行记录数量小于等于7，跳过
              if (allRuns.length <= maxRunsToKeep) {
                console.log(`  当前有 ${allRuns.length} 条记录，无需删除`);
                continue;
              }
              
              // 保留前7条（最新的），删除其余
              const runsToDelete = allRuns.slice(maxRunsToKeep);
              console.log(`  当前有 ${allRuns.length} 条记录，将保留最新的 ${maxRunsToKeep} 条，删除 ${runsToDelete.length} 条`);
              
              let deleted = 0;
              for (const run of runsToDelete) {
                console.log(`  删除: ${run.name || run.id} (ID: ${run.id}, 创建于: ${run.created_at})`);
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });

                deleted++;
                totalDeleted++;
                
                // 避免 API 速率限制，稍微延迟
                await new Promise(resolve => setTimeout(resolve, 100));
              }
              console.log(`  删除了 ${deleted} 条记录`);
            }
            console.log(`✅ 总共删除了 ${totalDeleted} 条运行记录`);